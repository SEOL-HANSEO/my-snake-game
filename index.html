<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지렁이 게임 (Snake Game)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            color: #ffffff;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 24px 30px 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 1px;
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
        }

        .scoreboard {
            display: flex;
            gap: 24px;
            font-size: 16px;
            margin-bottom: 16px;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 600;
        }

        .score-box span {
            color: #facc15;
            font-size: 18px;
        }

        .canvas-container {
            position: relative;
        }

        canvas {
            background-color: #0f172a;
            border: 3px solid #334155;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            transition: opacity 0.2s ease;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 32px;
            color: #f87171;
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .controls-info {
            margin-top: 18px;
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            gap: 16px;
        }

        .controls-info kbd {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: inherit;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <h1>🐍 지렁이 게임</h1>
    
    <div class="scoreboard">
        <div class="score-box">현재 점수: <span id="current-score">0</span></div>
        <div class="score-box">최고 점수: <span id="high-score">0</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="overlay" class="overlay">
            <h2 id="overlay-title">지렁이 게임</h2>
            <p id="overlay-msg">스페이스바 또는 시작 버튼을 누르세요</p>
            <button id="start-btn" class="btn">시작하기</button>
        </div>
    </div>

    <div class="controls-info">
        <span>조작: <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
        <span>일시정지: <kbd>Space</kbd></span>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const currentScoreEl = document.getElementById('current-score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    const GRID_SIZE = 20; // 20x20 그리드 (각 셀 20px)
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_high_score') || 0;
    let gameInterval = null;
    let isGameOver = false;
    let isPaused = false;
    let gameSpeed = 110; // ms

    highScoreEl.innerText = highScore;

    function initGame() {
        snake = [
            { x: 10, y: 10 },
            { x: 10, y: 11 },
            { x: 10, y: 12 }
        ];
        dx = 0;
        dy = -1;
        nextDx = 0;
        nextDy = -1;
        score = 0;
        currentScoreEl.innerText = score;
        isGameOver = false;
        isPaused = false;
        placeFood();
    }

    function placeFood() {
        while (true) {
            food.x = Math.floor(Math.random() * TILE_COUNT);
            food.y = Math.floor(Math.random() * TILE_COUNT);
            // 뱀 몸통 위에 음식이 생기지 않도록 확인
            const collision = snake.some(segment => segment.x === food.x && segment.y === food.y);
            if (!collision) break;
        }
    }

    function startGame() {
        initGame();
        overlay.classList.add('hidden');
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, gameSpeed);
    }

    function gameOver() {
        clearInterval(gameInterval);
        isGameOver = true;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('snake_high_score', highScore);
            highScoreEl.innerText = highScore;
        }
        overlayTitle.innerText = "게임 오버!";
        overlayMsg.innerText = `최종 점수: ${score}점`;
        startBtn.innerText = "다시 시작";
        overlay.classList.remove('hidden');
    }

    function togglePause() {
        if (isGameOver) return;
        isPaused = !isPaused;
        if (isPaused) {
            clearInterval(gameInterval);
            overlayTitle.innerText = "일시정지";
            overlayMsg.innerText = "계속하려면 스페이스바를 누르세요";
            startBtn.innerText = "계속하기";
            overlay.classList.remove('hidden');
        } else {
            overlay.classList.add('hidden');
            gameInterval = setInterval(gameLoop, gameSpeed);
        }
    }

    function gameLoop() {
        dx = nextDx;
        dy = nextDy;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // 벽 충돌 감지
        if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
            gameOver();
            return;
        }

        // 자기 몸 충돌 감지
        for (let i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head);

        // 음식 먹었는지 확인
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            currentScoreEl.innerText = score;
            placeFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        // 배경 클리어
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 격자 눈금 가이드 (은은하게)
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < canvas.width; i += GRID_SIZE) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(canvas.width, i);
            ctx.stroke();
        }

        // 음식 그리기
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        const foodRadius = GRID_SIZE / 2 - 2;
        ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, foodRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // 지렁이 그리기
        snake.forEach((segment, index) => {
            if (index === 0) {
                // 머리
                ctx.fillStyle = '#4ade80';
                ctx.shadowColor = '#4ade80';
                ctx.shadowBlur = 8;
            } else {
                // 몸통
                ctx.fillStyle = '#22c55e';
                ctx.shadowBlur = 0;
            }

            const x = segment.x * GRID_SIZE + 1;
            const y = segment.y * GRID_SIZE + 1;
            const size = GRID_SIZE - 2;
            const radius = index === 0 ? 6 : 4;

            ctx.beginPath();
            ctx.roundRect(x, y, size, size, radius);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 눈 그리기 (머리일 때)
            if (index === 0) {
                ctx.fillStyle = '#0f172a';
                let eye1X, eye1Y, eye2X, eye2Y;
                const offset = 5;

                if (dx === 1) { // 오른쪽
                    eye1X = x + size - offset; eye1Y = y + offset;
                    eye2X = x + size - offset; eye2Y = y + size - offset;
                } else if (dx === -1) { // 왼쪽
                    eye1X = x + offset; eye1Y = y + offset;
                    eye2X = x + offset; eye2Y = y + size - offset;
                } else if (dy === -1) { // 위쪽
                    eye1X = x + offset; eye1Y = y + offset;
                    eye2X = x + size - offset; eye2Y = y + offset;
                } else { // 아래쪽
                    eye1X = x + offset; eye1Y = y + size - offset;
                    eye2X = x + size - offset; eye2Y = y + size - offset;
                }

                ctx.beginPath();
                ctx.arc(eye1X, eye1Y, 2, 0, Math.PI * 2);
                ctx.arc(eye2X, eye2Y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        });
    }

    // 키보드 조작 이벤트 리스너
    window.addEventListener('keydown', (e) => {
        // 스페이스바 일시정지 / 시작
        if (e.code === 'Space') {
            e.preventDefault();
            if (isGameOver || overlay.classList.contains('hidden') === false && isPaused === false) {
                startGame();
            } else {
                togglePause();
            }
            return;
        }

        // 방향키 및 WASD
        switch (e.key.toLowerCase()) {
            case 'arrowup':
            case 'w':
                if (dy === 0) { nextDx = 0; nextDy = -1; }
                break;
            case 'arrowdown':
            case 's':
                if (dy === 0) { nextDx = 0; nextDy = 1; }
                break;
            case 'arrowleft':
            case 'a':
                if (dx === 0) { nextDx = -1; nextDy = 0; }
                break;
            case 'arrowright':
            case 'd':
                if (dx === 0) { nextDx = 1; nextDy = 0; }
                break;
        }
    });

    startBtn.addEventListener('click', () => {
        if (isPaused) {
            togglePause();
        } else {
            startGame();
        }
    });

    // 초기 화면 그리기
    initGame();
    draw();
</script>

</body>
</html>
